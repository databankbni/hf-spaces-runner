name: backup

# ---------------------------------------------------------------------------
# RUNNER PUBLIK. Data tetap privat di databankbni/hf-spaces-backup.
#
# 2026-08-14T04:20Z seluruh pipeline mati sekaligus. Sebabnya bukan kode:
# kuota GitHub Actions untuk repo PRIVAT pada paket Free adalah 2.000
# menit/bulan dan angka itu habis persis (2000/2000 di tagihan Agustus). Sejak
# saat itu setiap job ditolak sebelum langkah pertama dengan anotasi "The job
# was not started because recent account payments have failed or your spending
# limit needs to be increased" -- log kosong, durasi ~2 detik, status failure.
#
# Actions pada repo PUBLIK tidak memotong kuota itu sama sekali: repo publik
# databankbni/hf-spaces-archive-index memakai 2.680 menit pada bulan yang sama
# dengan tagihan nol. Jadi yang dipindah adalah WORKFLOW-nya, bukan datanya:
#   * checkout menarik repo data lewat SHIP_PAT (fine-grained PAT)
#   * BACKUP_REPO_SLUG memberi tahu tools/ repo data yang sebenarnya, karena
#     GITHUB_REPOSITORY di sini menunjuk ke repo runner; tanpa itu snapshot
#     orphan akan didorong ke repo yang salah dan tautan pohon per-Space di
#     katalog akan menunjuk ke repo runner
#   * publish memakai HTTPS + PAT, bukan PAGES_DEPLOY_KEY: kunci deploy itu
#     hanya terpasang di repo lama dan nilainya tidak bisa dibaca ulang
#
# Konsekuensi yang disengaja: log run ini publik. Isinya ID Space (sudah publik
# di katalog), jumlah berkas dan ukuran. Semua secret tetap ter-mask dan tidak
# ada satu pun isi repo privat yang dicetak.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Off the hour on purpose: GitHub queues scheduled runs and the top of the
    # hour is the most congested slot, where a run can be delayed or dropped.
    - cron: '23 2 * * *'     # daily incremental
    - cron: '23 3 * * 0'     # weekly deep sweep (Sunday)
  workflow_dispatch:
    inputs:
      mode:
        description: 'seed | daily | weekly'
        type: choice
        default: daily
        options: [daily, weekly, seed]
      limit:
        description: 'max third-party Spaces to snapshot this run (0 = no cap)'
        default: '0'
      time_budget_min:
        description: 'stop starting new work after N minutes'
        default: '120'
      skip_third_party:
        description: 'only back up own repos + archive database'
        type: boolean
        default: false
      force_resnapshot:
        description: 're-snapshot even when the commit sha is unchanged'
        type: boolean
        default: false
      design_full:
        description: 're-scan frontend design scores for every Space'
        type: boolean
        default: false

concurrency:
  group: hf-backup
  cancel-in-progress: false

permissions:
  # penjaga anti-dobel membaca daftar run workflow ini
  actions: read
  contents: read
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # Penjaga anti-dobel: jam luar (ghtrigger.py di Space monitor) menembak
      # workflow ini lewat workflow_dispatch, sementara cron GitHub juga hidup.
      # Tanpa ini satu hari jalan dua kali.
      #
      # Hanya event `schedule` yang bisa dilewati, dan hanya kalau sudah ada run
      # workflow_dispatch yang SUKSES dalam 12 jam terakhir. Kalau jam luar
      # mati, tidak ada run seperti itu, dan cron GitHub tetap dipakai sebagai
      # cadangan. Repo yang dibaca SENGAJA repo runner (GITHUB_REPOSITORY apa
      # adanya): riwayat run workflow ini hidup di sini, bukan di repo data.
      - name: Lewati kalau jam luar sudah menjalankannya
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          WF: backup.yml
          WINDOW_H: '12'
          EVENT: ${{ github.event_name }}
          SELF: ${{ github.run_id }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import calendar, json, os, sys, time, urllib.request

          def note(m):
              print(m, file=sys.stderr)

          ev = os.environ["EVENT"]
          if ev != "schedule":
              note(f"event={ev} -> jalan (jam luar / manual selalu menang)")
              print("run=true"); raise SystemExit

          repo = os.environ["GITHUB_REPOSITORY"]
          wf = os.environ["WF"]
          win = float(os.environ["WINDOW_H"])
          me = os.environ["SELF"]
          url = (f"https://api.github.com/repos/{repo}/actions/workflows/{wf}"
                 f"/runs?per_page=30&status=success&event=workflow_dispatch")
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"})
          try:
              with urllib.request.urlopen(req, timeout=30) as f:
                  runs = json.load(f).get("workflow_runs", [])
          except Exception as e:
              note(f"API gagal ({e}) -> jalan (gagal-aman)")
              print("run=true"); raise SystemExit

          cutoff = time.time() - win * 3600
          for r in runs:
              if str(r.get("id")) == me:
                  continue
              try:
                  ts = calendar.timegm(
                      time.strptime(r["created_at"], "%Y-%m-%dT%H:%M:%SZ"))
              except Exception:
                  continue
              if ts > cutoff:
                  note(f"run sukses {r['id']} ({r['event']}) pada "
                       f"{r['created_at']} masih dalam {win:g} jam -- "
                       f"run jadwal ini DILEWATI")
                  print("run=false"); raise SystemExit
          note(f"tidak ada run workflow_dispatch sukses dalam {win:g} jam "
               f"-> cron GitHub dipakai sebagai cadangan")
          print("run=true")
          PY
      # A stock runner leaves ~15 GB free; the mirrored working tree alone is
      # projected at ~13 GB. Deleting toolchains this job never uses buys ~25 GB
      # and must happen before the checkout, not after it runs out of room.
      - name: Free runner disk
        if: steps.dedup.outputs.run == 'true'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby \
                      /opt/hostedtoolcache/go /opt/hostedtoolcache/node || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      # `repository` + `token`: pohon kerjanya adalah repo DATA yang privat.
      # persist-credentials menyimpan PAT sebagai http.extraheader, jadi
      # `git push origin HEAD:main` di langkah-langkah berikut tetap jalan.
      - uses: actions/checkout@v4
        if: steps.dedup.outputs.run == 'true'
        with:
          repository: databankbni/hf-spaces-backup
          token: ${{ secrets.SHIP_PAT }}
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        if: steps.dedup.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Resolve run mode
        if: steps.dedup.outputs.run == 'true'
        id: cfg
        env:
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ inputs.mode }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_BUDGET: ${{ inputs.time_budget_min }}
        run: |
          if [ -n "$SCHEDULE" ]; then
            # Dulu perbandingan di sini memakai '0 3 * * 0' padahal cron
            # mingguannya '23 3 * * 0', jadi run Minggu selalu jatuh ke cabang
            # daily. Sekalian anggarannya dinaikkan: batas 2.000 menit/bulan
            # yang membentuk angka lama sudah tidak berlaku di repo publik,
            # dan kapasitas 240-600 snapshot per 50 menit di bawah permintaan
            # 490-620 Space/hari -- itu yang membuat antrean menumpuk.
            if [ "$SCHEDULE" = "23 3 * * 0" ]; then MODE=weekly; BUDGET=300; else MODE=daily; BUDGET=180; fi
            LIMIT=0
          else
            MODE="${IN_MODE:-daily}"; LIMIT="${IN_LIMIT:-0}"; BUDGET="${IN_BUDGET:-120}"
          fi
          echo "mode=$MODE"    >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT"  >> "$GITHUB_OUTPUT"
          echo "budget=$BUDGET" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$MODE limit=$LIMIT budget=${BUDGET}min"

      - name: Show environment
        if: steps.dedup.outputs.run == 'true'
        run: |
          git --version && gpg --version | head -1
          df -h / | tail -1

      - name: Run backup
        if: steps.dedup.outputs.run == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BACKUP_ENC_PASSPHRASE: ${{ secrets.BACKUP_ENC_PASSPHRASE }}
          # PAT, bukan secrets.GITHUB_TOKEN: token bawaan runner ini hanya
          # berlaku untuk repo runner dan tidak bisa mendorong ke repo data.
          GITHUB_TOKEN: ${{ secrets.SHIP_PAT }}
          BACKUP_REPO_SLUG: databankbni/hf-spaces-backup
          BACKUP_REPO_BRANCH: main
          ENGINE_REPO: databankbni/hf-spaces-backup
          ENGINE_BRANCH: engine-state
          HF_USER: js9ajs9as9
          DATASET_REPO: js9ajs9as9/hf-spaces-archive
          MODE: ${{ steps.cfg.outputs.mode }}
          LIMIT: ${{ steps.cfg.outputs.limit }}
          TIME_BUDGET_MIN: ${{ steps.cfg.outputs.budget }}
          SKIP_THIRD_PARTY: ${{ inputs.skip_third_party && '1' || '0' }}
          FORCE_RESNAPSHOT: ${{ inputs.force_resnapshot && '1' || '0' }}
          CLONE_WORKERS: '8'
          META_WORKERS: '16'
          PUSH_CHUNK_MB: '900'
        run: python tools/backup.py

      # Skor desain frontend: deterministik, offline, tanpa LLM dan tanpa HF.
      # Dijalankan DI SINI karena job inilah satu-satunya yang memegang seluruh
      # pohon `spaces/` (11+ GB) — job lain pakai sparse-checkout.
      # Inkremental berdasarkan `sha` snapshot di manifest/spaces.jsonl, jadi run
      # harian hanya memindai Space yang isinya benar-benar berubah.
      # `continue-on-error`: penilaian desain tidak boleh pernah menggagalkan
      # backup. Backup adalah tugas utama; skor desain hanya pelengkap katalog.
      - name: Scan frontend design
        if: steps.dedup.outputs.run == 'true'
        continue-on-error: true
        run: |
          t0=$(date +%s)
          python tools/design.py scan \
            --root spaces \
            --manifest manifest/spaces.jsonl \
            --out manifest/design.jsonl \
            ${{ inputs.design_full && '--full' || '' }}
          echo "design scan: $(( $(date +%s) - t0 ))s  $(wc -c < manifest/design.jsonl) B"
          if [ -n "$(git status --porcelain manifest/design.jsonl)" ]; then
            git add manifest/design.jsonl
            git -c user.name='hf-backup-bot' \
                -c user.email='hf-backup-bot@users.noreply.github.com' \
                commit -q -m "design: refresh frontend design scores"
            for i in 1 2 3; do
              git push -q origin HEAD:main && break
              git pull --rebase -q origin main || true
            done
          else
            echo "manifest/design.jsonl unchanged"
          fi

      - name: Rebuild the browsable index
        if: steps.dedup.outputs.run == 'true'
        env:
          BACKUP_REPO_SLUG: databankbni/hf-spaces-backup
          BACKUP_REPO_BRANCH: main
        run: |
          python tools/mkindex.py
          if [ -n "$(git status --porcelain index.html)" ]; then
            git add index.html
            git -c user.name='hf-backup-bot' \
                -c user.email='hf-backup-bot@users.noreply.github.com' \
                commit -q -m "index: rebuild browsable catalogue"
            for i in 1 2 3; do
              git push -q origin HEAD:main && break
              git pull --rebase -q origin main || true
            done
          else
            echo "index.html unchanged"
          fi

      # The public copy is stripped of curation scoring and encrypted with the
      # catalogue password before it ever leaves the runner. mkindex.py aborts
      # if CATALOGUE_PASSWORD is empty rather than publishing in the clear.
      #
      # Commit yatim + force-push, sama seperti publish-index: katalog adalah
      # berkas TURUNAN ~5,7 MB per terbit, riwayatnya tidak bernilai, dan
      # penulis terakhir yang menang menghapus seluruh perlombaan push antara
      # dua workflow ini. `git add -A` di atas hasil clone menjaga
      # .github/workflows/ repo publik tetap ada di commit yatim itu.
      - name: Publish the public catalogue
        id: pub
        if: env.PAGES_TOKEN != '' && env.CATALOGUE_PASSWORD != '' && steps.dedup.outputs.run == 'true'
        env:
          PAGES_TOKEN: ${{ secrets.SHIP_PAT }}
          PAGES_SLUG: databankbni/hf-spaces-archive-index
          CATALOGUE_PASSWORD: ${{ secrets.CATALOGUE_PASSWORD }}
          BACKUP_REPO_SLUG: databankbni/hf-spaces-backup
          BACKUP_REPO_BRANCH: main
        run: |
          set -u
          pip install --quiet cryptography
          python tools/mkindex.py --public \
                 --password-env CATALOGUE_PASSWORD -o /tmp/public.html
          rm -rf /tmp/pages
          git clone -q --depth 1 "https://github.com/${PAGES_SLUG}.git" /tmp/pages
          cp /tmp/public.html /tmp/pages/index.html
          printf 'User-agent: *\nDisallow: /\n' > /tmp/pages/robots.txt
          : > /tmp/pages/.nojekyll
          cd /tmp/pages
          git checkout -q --orphan terbit
          git add -A
          git -c user.name='hf-backup-bot' \
              -c user.email='hf-backup-bot@users.noreply.github.com' \
              commit -qm "catalogue: $(date -u +%Y-%m-%d\ %H:%M) UTC"
          baru=$(git rev-parse HEAD)
          if [ "$(git rev-parse --verify -q origin/main^{tree} || true)" \
               = "$(git rev-parse HEAD^{tree})" ]; then
            echo "catalogue unchanged"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git push -q -f \
                 "https://x-access-token:${PAGES_TOKEN}@github.com/${PAGES_SLUG}.git" \
                 terbit:main; then
            echo "::error::could not push the catalogue"; exit 1
          fi
          echo "published $baru"
          echo "sha=$baru" >> "$GITHUB_OUTPUT"

      # Kedua inang harus bergerak bersama. Sebelum langkah ini ada, backup.yml
      # menerbitkan katalog baru ke GitHub Pages tapi cermin HF tetap tinggal di
      # isi lama sampai slot publish-index berikutnya — dua inang beda angka
      # selama berjam-jam. Force-push idempoten, jadi aman dijalankan walau
      # katalognya tidak berubah; itu sekalian membetulkan drift.
      - name: Mirror to the Hugging Face static Space
        if: steps.pub.outcome == 'success' && steps.dedup.outputs.run == 'true'
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: js9ajs9as9/ktlg-sijasja90sja0s9
        run: |
          set -u
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::warning::HF_TOKEN kosong, cermin dilewati"; exit 0
          fi
          if [ ! -s /tmp/public.html ]; then
            echo "::warning::/tmp/public.html tidak ada, cermin dilewati"; exit 0
          fi
          rm -rf /tmp/cermin && mkdir -p /tmp/cermin && cd /tmp/cermin
          git init -q
          cp /tmp/public.html index.html
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          cat > README.md <<'EOF'
          ---
          title: Katalog
          emoji: "\U0001F4DA"
          colorFrom: gray
          colorTo: gray
          sdk: static
          pinned: false
          ---

          Cermin katalog. Isi terenkripsi AES-256-GCM; perlu kata sandi.
          EOF
          sed -i 's/^          //' README.md
          git add -A
          git -c user.name='hf-backup-bot' \
              -c user.email='hf-backup-bot@users.noreply.github.com' \
              commit -qm "katalog: cermin $(date -u +%Y-%m-%dT%H:%MZ)"
          git branch -M main
          # Token hanya hidup di URL remote yang tidak pernah di-commit.
          if git push -q -f \
               "https://js9ajs9as9:${HF_TOKEN}@huggingface.co/spaces/${SPACE}" main; then
            echo "cermin terkirim ke ${SPACE}"
          else
            echo "::warning::cermin HF gagal; inang utama tetap terbit"
          fi

      - name: Repository size report
        if: always() && steps.dedup.outputs.run == 'true'
        run: |
          echo "working tree:"; du -sh spaces app archive manifest 2>/dev/null || true
          echo "git objects:"; du -sh .git 2>/dev/null || true
          echo "largest tracked files:"
          git ls-files -z | xargs -0 -r du -h 2>/dev/null | sort -rh | head -5 || true

      - name: Weekly maintenance
        if: steps.cfg.outputs.mode == 'weekly' && steps.dedup.outputs.run == 'true'
        run: git gc --prune=now --quiet || true

      # Isu dibuka di repo runner (publik) memakai token bawaannya, bukan di
      # repo data: PAT sengaja tidak dipakai untuk ini supaya kegagalan CI
      # tercatat di tempat run-nya berada.
      - name: Open an issue when the backup fails
        if: failure() && steps.dedup.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Backup run failed ($(date -u +%Y-%m-%d))"
          BODY="Run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) failed in mode \`${{ steps.cfg.outputs.mode }}\`. The manifest is resumable: the next scheduled run continues from where this one stopped."
          EXISTING=$(gh issue list --state open --label backup-failure --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create backup-failure --color d73a4a --description "Automated backup failure" 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label backup-failure
          fi
