name: watchdog

# Guards against the silent-failure mode that matters most: a backup that stops
# running without anyone noticing.
#
# 2026-08-15: workflow ini DIPINDAH dari repo privat databankbni/hf-spaces-backup
# ke repo publik databankbni/hf-spaces-runner. Alasannya: kuota Actions repo
# privat (2.000 menit/bulan paket Free) habis pada 2026-08-14 04:20Z dan SEMUA
# run ditolak sebelum langkah pertama (gagal dalam ~2 detik, log kosong).
# Menit Actions di repo PUBLIK tidak dibatasi, jadi mesinnya pindah ke sini
# sementara datanya tetap privat -- diambil lewat checkout dengan SHIP_PAT.
#
# Insiden itu juga menelanjangi dua kelemahan watchdog versi lama, dan keduanya
# diperbaiki di sini:
#
#   1. Ia ikut mati. Ia hidup di repo yang sama dengan yang ia awasi, jadi
#      begitu kuota repo itu habis, penjaganya mati bersama yang dijaga.
#      Sekarang ia hidup di repo yang menitnya gratis.
#
#   2. Ia hanya melihat UMUR manifest, dan ambangnya 48 jam dengan patroli
#      sehari sekali -- artinya alarm paling cepat berbunyi ~2 hari setelah
#      kejadian. Nyatanya katalog beku 36 jam dan watchdog masih bilang
#      "belum basi". Sekarang: patroli tiap 6 jam, ambang 26 jam (satu backup
#      harian yang bolong langsung terlihat besok paginya), DITAMBAH
#      pemeriksaan kedua yang tidak menunggu data jadi basi sama sekali --
#      ia membaca riwayat run dan langsung berteriak kalau backup/publish
#      beruntun gagal, termasuk mengenali tanda khas pemblokiran kuota/tagihan
#      (run gagal dalam beberapa detik tanpa langkah apa pun).

on:
  schedule:
    # Tiap 6 jam, bukan sekali sehari. Run ini ~20 detik dan menitnya gratis di
    # repo publik, jadi tidak ada alasan menunggu sehari untuk tahu mesin mati.
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'alert when the last successful run is older than this'
        default: '26'

permissions:
  # penjaga anti-dobel + pemeriksa riwayat run membaca daftar run
  actions: read
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Penjaga anti-dobel. Lihat tools/../addguard.py di catatan kerja:
      # cron GitHub baru hidup 2026-08-05 (event schedule pertama akun ini,
      # telat 3 jam), sementara jam luar sudah menembak workflow ini lewat
      # workflow_dispatch. Tanpa ini, satu slot jalan dua kali.
      #
      # WINDOW_H sengaja 3 jam, bukan 12 seperti workflow lain. Jam luar
      # menembak watchdog sekali sehari (07:01 UTC) sedangkan cron di sini
      # empat kali sehari; dengan jendela 12 jam, dua dari empat patroli akan
      # ikut terlewat dan detak 6-jam yang baru saja dipasang jadi sia-sia.
      # Tiga jam cukup untuk menelan tabrakan 06:41-vs-07:01 dan tidak lebih.
      #
      # GITHUB_REPOSITORY di sini SENGAJA repo runner (bukan repo data):
      # riwayat run sekarang tinggal di repo ini.
      - name: Lewati kalau jam luar sudah menjalankannya
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          WF: watchdog.yml
          WINDOW_H: '3'
          EVENT: ${{ github.event_name }}
          SELF: ${{ github.run_id }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import calendar, json, os, sys, time, urllib.request

          def note(m):
              print(m, file=sys.stderr)

          ev = os.environ["EVENT"]
          if ev != "schedule":
              note(f"event={ev} -> jalan (jam luar / manual selalu menang)")
              print("run=true"); raise SystemExit

          repo = os.environ["GITHUB_REPOSITORY"]
          wf = os.environ["WF"]
          win = float(os.environ["WINDOW_H"])
          me = os.environ["SELF"]
          url = (f"https://api.github.com/repos/{repo}/actions/workflows/{wf}"
                 f"/runs?per_page=30&status=success&event=workflow_dispatch")
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"})
          try:
              with urllib.request.urlopen(req, timeout=30) as f:
                  runs = json.load(f).get("workflow_runs", [])
          except Exception as e:
              note(f"API gagal ({e}) -> jalan (gagal-aman)")
              print("run=true"); raise SystemExit

          cutoff = time.time() - win * 3600
          for r in runs:
              if str(r.get("id")) == me:
                  continue
              try:
                  ts = calendar.timegm(
                      time.strptime(r["created_at"], "%Y-%m-%dT%H:%M:%SZ"))
              except Exception:
                  continue
              if ts > cutoff:
                  note(f"run sukses {r['id']} ({r['event']}) pada "
                       f"{r['created_at']} masih dalam {win:g} jam -- "
                       f"run jadwal ini DILEWATI")
                  print("run=false"); raise SystemExit
          note(f"tidak ada run workflow_dispatch sukses dalam {win:g} jam "
               f"-> cron GitHub dipakai sebagai cadangan")
          print("run=true")
          PY

      # Pemeriksaan yang TIDAK menunggu data jadi basi. Umur manifest baru
      # bergerak setelah backup gagal berjam-jam; riwayat run bergerak
      # seketika. Insiden 14 Agustus terlihat di sini dalam menit, bukan hari:
      # empat workflow berbeda semuanya gagal dalam ~2 detik tanpa satu pun
      # langkah dijalankan -- itu bukan bug kode, itu job yang ditolak sebelum
      # start (kuota/tagihan). Dua kondisi dibedakan supaya isi issue-nya
      # menyuruh orang melihat tempat yang benar.
      - name: Periksa riwayat run (deteksi cepat)
        if: steps.dedup.outputs.run == 'true'
        id: hist
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH: backup.yml publish-index.yml
          STREAK: '3'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys, urllib.request

          def note(m):
              print(m, file=sys.stderr)

          repo = os.environ["GITHUB_REPOSITORY"]
          need = int(os.environ["STREAK"])
          H = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
               "Accept": "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28"}

          def runs(wf):
              url = (f"https://api.github.com/repos/{repo}/actions/workflows/{wf}"
                     f"/runs?per_page=10&status=completed")
              req = urllib.request.Request(url, headers=H)
              with urllib.request.urlopen(req, timeout=30) as f:
                  return json.load(f).get("workflow_runs", [])

          def dur(r):
              # run yang ditolak sebelum start selesai dalam hitungan detik
              import calendar, time
              def p(s):
                  try:
                      return calendar.timegm(time.strptime(s, "%Y-%m-%dT%H:%M:%SZ"))
                  except Exception:
                      return None
              a, b = p(r.get("run_started_at") or ""), p(r.get("updated_at") or "")
              return (b - a) if (a and b) else None

          bad, blocked, lines = [], [], []
          for wf in os.environ["WATCH"].split():
              try:
                  rs = runs(wf)
              except Exception as e:
                  note(f"{wf}: API gagal ({e}) -- dilewati")
                  continue
              if not rs:
                  note(f"{wf}: belum ada run selesai")
                  continue
              head = rs[:need]
              concl = [r.get("conclusion") for r in head]
              note(f"{wf}: {need} run terakhir -> {concl}")
              if len(head) == need and all(c == "failure" for c in head):
                  bad.append(wf)
                  quick = [d for d in (dur(r) for r in head) if d is not None and d < 15]
                  tag = ""
                  if len(quick) == need:
                      blocked.append(wf)
                      tag = (" -- SEMUANYA gagal dalam <15 detik: tanda job "
                             "ditolak sebelum start (kuota Actions / tagihan), "
                             "bukan bug kode")
                  lines.append(f"{wf}: {need} run terakhir gagal berturut-turut"
                               f" (terbaru {head[0]['html_url']}){tag}")

          print(f"degraded={'true' if bad else 'false'}")
          print(f"blocked={'true' if blocked else 'false'}")
          print("hist_reason=" + ("; ".join(lines) if lines
                                  else "riwayat run backup/publish sehat"))
          PY

      # Sparse ON PURPOSE. Pohon kerja repo data sudah 15,9 GB + ~5 GB .git,
      # sementara runner ubuntu-latest hanya punya ~14 GB kosong di disk OS.
      # Run 30978760164 (2026-08-05 05:39Z) mati di tengah checkout penuh
      # ---------------------------------------------------------------- #
      # Titik buta yang terbukti mahal (insiden 2026-08-18 s/d 19).
      #
      # Backup hijau, publish hijau, Space "RUNNING", freshness manifest lolos
      # -- tapi katalog beku 6.776 baris selama ~36 jam dan watchdog diam.
      # Sebabnya: seluruh kolam 404 kunci Cerebras dijawab HTTP 402
      # payment_required, jadi mesin kurasi mati sementara semua yang diawasi
      # watchdog tetap sehat. Tidak ada satu pun pemeriksaan yang menanyakan
      # "apakah arsip masih BERTAMBAH?".
      #
      # Sekarang watchdog membaca /health monitor:
      #   llm.ready=false   -> LLM mati; arsip lanjut di mode darurat (uji asap
      #                        deterministik, tanpa nilai kurasi) dan akan
      #                        dinilai ulang oleh curator.backfill() nanti.
      #   queue_depth besar -> kandidat menumpuk, pekerja tidak menghabiskannya.
      #   mayoritas reject "llm plan error" -> tanda LLM mati pada versi lama
      #                        /health yang belum punya blok llm.
      - name: Periksa kesehatan kurasi (monitor /health)
        if: steps.dedup.outputs.run == 'true'
        id: mon
        env:
          MONITOR: ${{ vars.MONITOR_SPACE || 'js9ajs9as9/mntor-sijasja90sja0s9' }}
          QUEUE_LIMIT: '250'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys, urllib.request

          def note(m):
              print(m, file=sys.stderr)

          space = os.environ["MONITOR"].strip()
          host = space.replace("/", "-").replace(".", "-").lower()
          url = f"https://{host}.hf.space/health"
          try:
              req = urllib.request.Request(
                  url, headers={"User-Agent": "hf-spaces-archive-bot/1.0"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  h = json.load(r)
          except Exception as e:
              # monitor tak terjangkau: itu sendiri sudah alarm
              print("llm_down=true")
              print(f"mon_reason=monitor /health tak terjangkau: {e!r}"[:400])
              raise SystemExit

          llm = h.get("llm") or {}
          st = h.get("stats") or {}
          rj = h.get("rejects") or []
          q = int(h.get("queue_depth") or 0)
          limit = int(os.environ.get("QUEUE_LIMIT") or 250)

          bad = [str(r.get("reason", "")).lower() for r in rj if isinstance(r, dict)]
          nllm = sum(1 for r in bad if "llm plan error" in r or "402" in r)
          share = (nllm / len(bad)) if bad else 0.0

          ready = llm.get("ready")
          why = []
          if ready is False:
              why.append(
                  f"LLM MATI: model={llm.get('model')} kunci={llm.get('keys')} "
                  f"terpakai={llm.get('keys_usable')} "
                  f"cooldown_paywall={llm.get('paywall_cooldown_s')}s "
                  f"cadangan={llm.get('fallback_providers')} "
                  f"galat={str(llm.get('last_error'))[:120]}")
          if ready is None and share >= 0.4:
              why.append(f"{nllm}/{len(bad)} penolakan terakhir gagal karena LLM")
          if q >= limit:
              why.append(f"antrean menumpuk: {q} kandidat (ambang {limit})")

          reason = ("; ".join(why) if why else
                    f"kurasi sehat: llm.ready={ready} antrean={q} "
                    f"arsip={st.get('archived_total')} darurat={st.get('degraded')} "
                    f"ditunda={st.get('deferred')}")
          # $GITHUB_OUTPUT satu baris per nilai: galat LLM bisa memuat newline.
          reason = " ".join(reason.split())[:400]
          print(f"llm_down={'true' if why else 'false'}")
          print(f"mon_reason={reason}")
          note(f"/health: count={h.get('count')} queue={q} "
               f"archived_total={st.get('archived_total')} "
               f"degraded={st.get('degraded')} llm.ready={ready}")
          PY

      # tanpa meninggalkan log -- tanda khas runner kehabisan disk. Watchdog
      # cuma membaca satu berkas, manifest/summary.json.
      #
      # repository + token: datanya ada di repo LAIN yang privat.
      - uses: actions/checkout@v4
        if: steps.dedup.outputs.run == 'true'
        with:
          repository: databankbni/hf-spaces-backup
          token: ${{ secrets.SHIP_PAT }}
          fetch-depth: 1
          sparse-checkout: |
            /manifest/
          sparse-checkout-cone-mode: false

      # Ambang 26 jam, bukan 48. Backup jalan harian 02:43 UTC dan manifest
      # ikut segar ~03:30, jadi pada patroli normal umurnya beberapa jam saja.
      # Dengan 26 jam, SATU backup harian yang bolong sudah cukup memicu alarm;
      # dengan 48 jam yang lama, butuh dua hari bolong -- dan itulah sebabnya
      # katalog bisa beku 36 jam tanpa satu pun peringatan.
      - name: Evaluate freshness
        if: steps.dedup.outputs.run == 'true'
        id: check
        env:
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '26' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, time, calendar
          max_age = float(os.environ.get("MAX_AGE_HOURS") or 26)
          try:
              s = json.load(open("manifest/summary.json"))
          except Exception as e:
              print(f"stale=true"); print(f"reason=summary.json unreadable: {e}"); raise SystemExit
          ts = s.get("updated_at", "")
          try:
              age_h = (time.time() - calendar.timegm(time.strptime(ts, "%Y-%m-%dT%H:%M:%SZ"))) / 3600
          except Exception:
              print("stale=true"); print(f"reason=unparsable timestamp {ts!r}"); raise SystemExit
          counts = s.get("status_counts", {})
          stale = age_h > max_age
          print(f"stale={'true' if stale else 'false'}")
          print(f"reason=last successful run {age_h:.1f}h ago (limit {max_age:.0f}h); "
                f"tracked={s.get('tracked_spaces')} status={counts}")
          print(f"age_h={age_h:.1f}")
          PY

      # GH_REPO dipaku ke repo runner. Tanpa ini `gh` menebak repo dari remote
      # git hasil checkout -- yaitu repo DATA yang privat -- dan token bawaan
      # workflow ini tidak punya izin membuka issue di sana.
      - name: Alert on stale or failing backup
        if: >-
          steps.dedup.outputs.run == 'true' &&
          (steps.check.outputs.stale == 'true' || steps.hist.outputs.degraded == 'true' ||
           steps.mon.outputs.llm_down == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REASON: ${{ steps.check.outputs.reason }}
          HIST: ${{ steps.hist.outputs.hist_reason }}
          STALE: ${{ steps.check.outputs.stale }}
          BLOCKED: ${{ steps.hist.outputs.blocked }}
          MON: ${{ steps.mon.outputs.mon_reason }}
          LLM_DOWN: ${{ steps.mon.outputs.llm_down }}
        run: |
          BODY="Backup pipeline needs attention."
          if [ "$STALE" = "true" ]; then
            BODY="${BODY}
          - manifest stale: ${REASON}"
          fi
          BODY="${BODY}
          - run history: ${HIST}
          - kurasi/monitor: ${MON}"
          if [ "$LLM_DOWN" = "true" ]; then
            BODY="${BODY}

          Mesin kurasi (LLM) tidak bisa dipakai. Arsip TIDAK berhenti: monitor
          masuk mode darurat (uji asap deterministik tanpa nilai kurasi) dan
          curator.backfill() akan menilai ulang catatan itu begitu ada LLM
          sungguhan. Yang perlu dilakukan: pulihkan tagihan Cerebras, ATAU isi
          salah satu secret Space berikut supaya jalur cadangan hidup --
          GROQ_KEYS / GOOGLE_AI_KEYS / OPENROUTER_KEYS / LLM_EXTRA_PROVIDERS.
          Konteks: 2026-08-18 seluruh kolam 404 kunci Cerebras balas HTTP 402
          payment_required dan katalog beku 36 jam tanpa satu pun alarm."
          fi
          if [ "$BLOCKED" = "true" ]; then
            BODY="${BODY}

          Jobs are failing in seconds with no steps executed. That is not a code
          bug: the runs are being rejected before they start. Check the Actions
          minute allowance / billing for the repository that owns the runs, not
          the workflow code. This is exactly what happened on 2026-08-14, when
          the private data repo hit 2,000/2,000 Free-plan minutes and the whole
          pipeline went dark for 36 hours."
          fi
          BODY="${BODY}

          Engine repo: databankbni/hf-spaces-backup (data, private).
          Runner repo: ${GH_REPO} (public, free Actions minutes)."
          EXISTING=$(gh issue list --state open --label backup-stale --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create backup-stale --color fbca04 --description "Backup has not run recently" 2>/dev/null || true
            gh issue create --title "Backup pipeline degraded" --body "$BODY" --label backup-stale
          fi

      - name: Report
        if: steps.dedup.outputs.run == 'true'
        run: |
          echo "freshness: ${{ steps.check.outputs.reason }}"
          echo "history:   ${{ steps.hist.outputs.hist_reason }}"
          echo "kurasi:    ${{ steps.mon.outputs.mon_reason }}"
