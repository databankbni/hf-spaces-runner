name: watchdog

# Guards against the silent-failure mode that matters most: a backup that stops
# running without anyone noticing. Alerts if the manifest has not been refreshed
# within the staleness window.
#
# 2026-08-15: workflow ini DIPINDAH dari repo privat databankbni/hf-spaces-backup
# ke repo publik databankbni/hf-spaces-runner. Alasannya: kuota Actions repo
# privat (2.000 menit/bulan paket Free) habis pada 2026-08-14 04:20Z dan SEMUA
# run ditolak sebelum langkah pertama (gagal dalam ~2 detik, log kosong).
# Menit Actions di repo PUBLIK tidak dibatasi, jadi mesinnya pindah ke sini
# sementara datanya tetap privat -- diambil lewat checkout dengan SHIP_PAT.
#
# Ironisnya watchdog inilah yang seharusnya menangkap insiden itu: ia juga
# ikut mati karena kuota, jadi tidak ada issue yang terbuka. Sekarang ia
# hidup di repo yang menitnya gratis, jadi tidak bisa dibungkam oleh kuota
# repo data.

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'alert when the last successful run is older than this'
        default: '48'

permissions:
  # penjaga anti-dobel membaca daftar run workflow ini
  actions: read
  contents: read
  issues: write

env:
  DATA_REPO: databankbni/hf-spaces-backup

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Penjaga anti-dobel. Lihat tools/../addguard.py di catatan kerja:
      # cron GitHub baru hidup 2026-08-05 (event schedule pertama akun ini,
      # telat 3 jam), sementara jam luar sudah menembak workflow ini lewat
      # workflow_dispatch. Tanpa ini, satu hari jalan dua kali.
      #
      # Hanya event `schedule` yang bisa dilewati, dan hanya kalau sudah ada
      # run workflow_dispatch yang SUKSES dalam 12 jam terakhir. Kalau jam
      # luar mati, tidak ada run seperti itu, dan cron GitHub tetap dipakai
      # sebagai cadangan.
      #
      # GITHUB_REPOSITORY di sini SENGAJA repo runner (bukan repo data):
      # riwayat run sekarang tinggal di repo ini.
      - name: Lewati kalau jam luar sudah menjalankannya
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          WF: watchdog.yml
          WINDOW_H: '12'
          EVENT: ${{ github.event_name }}
          SELF: ${{ github.run_id }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import calendar, json, os, sys, time, urllib.request

          def note(m):
              print(m, file=sys.stderr)

          ev = os.environ["EVENT"]
          if ev != "schedule":
              note(f"event={ev} -> jalan (jam luar / manual selalu menang)")
              print("run=true"); raise SystemExit

          repo = os.environ["GITHUB_REPOSITORY"]
          wf = os.environ["WF"]
          win = float(os.environ["WINDOW_H"])
          me = os.environ["SELF"]
          url = (f"https://api.github.com/repos/{repo}/actions/workflows/{wf}"
                 f"/runs?per_page=30&status=success&event=workflow_dispatch")
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"})
          try:
              with urllib.request.urlopen(req, timeout=30) as f:
                  runs = json.load(f).get("workflow_runs", [])
          except Exception as e:
              note(f"API gagal ({e}) -> jalan (gagal-aman)")
              print("run=true"); raise SystemExit

          cutoff = time.time() - win * 3600
          for r in runs:
              if str(r.get("id")) == me:
                  continue
              try:
                  ts = calendar.timegm(
                      time.strptime(r["created_at"], "%Y-%m-%dT%H:%M:%SZ"))
              except Exception:
                  continue
              if ts > cutoff:
                  note(f"run sukses {r['id']} ({r['event']}) pada "
                       f"{r['created_at']} masih dalam {win:g} jam -- "
                       f"run jadwal ini DILEWATI")
                  print("run=false"); raise SystemExit
          note(f"tidak ada run workflow_dispatch sukses dalam {win:g} jam "
               f"-> cron GitHub dipakai sebagai cadangan")
          print("run=true")
          PY

      # Sparse ON PURPOSE. Pohon kerja repo data sudah 15,9 GB + ~5 GB .git,
      # sementara runner ubuntu-latest hanya punya ~14 GB kosong di disk OS.
      # Run 30978760164 (2026-08-05 05:39Z) mati di tengah checkout penuh
      # tanpa meninggalkan log -- tanda khas runner kehabisan disk. Watchdog
      # cuma membaca satu berkas, manifest/summary.json.
      #
      # repository + token: datanya ada di repo LAIN yang privat.
      - uses: actions/checkout@v4
        if: steps.dedup.outputs.run == 'true'
        with:
          repository: databankbni/hf-spaces-backup
          token: ${{ secrets.SHIP_PAT }}
          fetch-depth: 1
          sparse-checkout: |
            /manifest/
          sparse-checkout-cone-mode: false

      - name: Evaluate freshness
        if: steps.dedup.outputs.run == 'true'
        id: check
        env:
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '48' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, time, calendar
          max_age = float(os.environ.get("MAX_AGE_HOURS") or 48)
          try:
              s = json.load(open("manifest/summary.json"))
          except Exception as e:
              print(f"stale=true"); print(f"reason=summary.json unreadable: {e}"); raise SystemExit
          ts = s.get("updated_at", "")
          try:
              age_h = (time.time() - calendar.timegm(time.strptime(ts, "%Y-%m-%dT%H:%M:%SZ"))) / 3600
          except Exception:
              print("stale=true"); print(f"reason=unparsable timestamp {ts!r}"); raise SystemExit
          counts = s.get("status_counts", {})
          stale = age_h > max_age
          print(f"stale={'true' if stale else 'false'}")
          print(f"reason=last successful run {age_h:.1f}h ago (limit {max_age:.0f}h); "
                f"tracked={s.get('tracked_spaces')} status={counts}")
          print(f"age_h={age_h:.1f}")
          PY

      # GH_REPO dipaku ke repo runner. Tanpa ini `gh` menebak repo dari remote
      # git hasil checkout -- yaitu repo DATA yang privat -- dan token bawaan
      # workflow ini tidak punya izin membuka issue di sana.
      - name: Alert on stale backup
        if: steps.check.outputs.stale == 'true' && steps.dedup.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          EXISTING=$(gh issue list --state open --label backup-stale --json number --jq '.[0].number' 2>/dev/null || true)
          BODY="Backup appears stale: ${REASON}. Check the \`backup\` workflow runs and the HF_TOKEN secret validity."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create backup-stale --color fbca04 --description "Backup has not run recently" 2>/dev/null || true
            gh issue create --title "Backup is stale" --body "$BODY" --label backup-stale
          fi

      - name: Report
        if: steps.dedup.outputs.run == 'true'
        run: echo "${{ steps.check.outputs.reason }}"
